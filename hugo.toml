baseURL = "https://dragonb6874.github.io/"
locale = "ko-kr"
title = "hello"
theme = "hyde"

# 한 페이지에 보일 글 개수
[pagination]
  pagerSize = 5

[params]
  # 사이드바 설명문
  description = "ccc"
  # Hyde 8색 테마 중 하나: theme-base-08(red) 09(orange) 0a(yellow)
  # 0b(green) 0c(cyan) 0d(blue) 0e(magenta) 0f(brown)
  themeColor = "theme-base-09"
  # true 면 사이드바가 오른쪽으로
  layoutReverse = false

[author]
  name = "dragonb6874"

# 사이드바 네비게이션 메뉴
[[menu.main]]
