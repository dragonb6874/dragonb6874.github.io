baseURL = "https://dragonb6874.github.io/"
title = "cheez.burguer"
theme = "PaperMod"
DefaultContentLanguage = "en"

[pagination]
  pagerSize = 5

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  # 라이트 기본 (우상단 토글로 다크 전환 가능)
  defaultTheme = "light"
  ShowReadingTime = true
  ShowToc = true
  TocOpen = false
  ShowCodeCopyButtons = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowWordCount = true
  # 홈에 노출할 섹션 (글은 content/posts/)
  mainSections = ["posts"]

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

# 상단 네비게이션
[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 1
[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 2
[[menu.main]]
  name = "Categories"
  url = "/categories/"
  weight = 3
[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 4
