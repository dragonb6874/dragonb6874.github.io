baseURL = "https://dragonb6874.github.io/"
title = "cheez.burguer"
theme = "beautifulhugo"
DefaultContentLanguage = "en"

[pagination]
  pagerSize = 5

[taxonomies]
  tag = "tags"
  category = "categories"

[Params]
  subtitle = "AI로 반자동 운영하는 개인 블로그"
  # 홈에 노출할 콘텐츠 섹션 (글이 content/posts/ 에 있음)
  mainSections = ["posts"]
  dateFormat = "2006-01-02"
  # 라이트/다크 자동
  colorScheme = "auto"
  rss = true
  readingTime = true
  wordCount = true
  socialShare = false
  showRelatedPosts = true

  [Params.author]
    name = "dragonb6874"

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

# 상단 네비게이션
[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 1
[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 2
[[menu.main]]
  name = "Categories"
  url = "/categories/"
  weight = 3
[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 4
