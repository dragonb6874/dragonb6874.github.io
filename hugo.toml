baseURL = "https://dragonb6874.github.io/"
title = "cheez.burguer"
theme = "PaperMod"
DefaultContentLanguage = "en"
enableRobotsTXT = true

[services.googleAnalytics]
  ID = "G-GNK0VQ34VE"

[pagination]
  pagerSize = 5

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  # 라이트 기본 (우상단 토글로 다크 전환 가능)
  defaultTheme = "light"
  ShowReadingTime = true
  ShowToc = true
  TocOpen = false
  ShowCodeCopyButtons = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowWordCount = true
  # 홈에 노출할 섹션 (글은 content/posts/)
  mainSections = ["posts"]

  # 홈 상단 소개문 (Home-Info 모드 → 아래에 글 목록 유지)
  [params.homeInfoParams]
    Title = "Hello World!"
    Content = ""

  # 홈 소개문 아래 아이콘 링크
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/dragonb6874"
  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  # ==텍스트== → <mark> 형광펜 하이라이트 활성화
  [markup.goldmark.extensions.extras.mark]
    enable = true

# 상단 네비게이션
[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 1
[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 2
[[menu.main]]
  name = "Categories"
  url = "/categories/"
  weight = 3
[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 4
